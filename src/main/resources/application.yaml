spring:
  application:
    name: marketplace
  profiles:
    default: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_RUNTIME_USER}
    password: ${DB_RUNTIME_PASSWORD}
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    url: ${DB_URL}
    user: ${DB_MIGRATION_USER}
    password: ${DB_MIGRATION_PASSWORD}
    default-schema: marketplace
    schemas: marketplace
    create-schemas: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
    clean-disabled: true
  modulith:
    detection-strategy: explicitly-annotated
  jackson:
    deserialization:
      fail-on-unknown-properties: true

marketplace:
  dev-fixtures:
    enabled: false
  quick-login:
    enabled: false
  jwt:
    issuer: ${JWT_ISSUER:marketplace}
    audience: ${JWT_AUDIENCE:marketplace-api}
    access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
