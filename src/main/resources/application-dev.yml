spring:
  config:
    activate:
      on-profile: dev
    import: optional:file:${MARKETPLACE_ENV_FILE:.env}[.properties]

marketplace:
  cart:
    allowed-origins: ${CART_ALLOWED_ORIGINS:http://localhost:3000}
  dev-fixtures:
    enabled: ${DEV_FIXTURES_ENABLED:false}
  quick-login:
    enabled: false
