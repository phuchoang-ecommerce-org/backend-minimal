  unresolved_decisions: []
scenarios:
  - scenario_id: AT-UC-04-05-06-HTTP-STOCK-VERSION
    title: Checkout and cancellation HTTP commands invalidate an old Seller stock edit
    trace: {use_cases: [UC-04, UC-05, UC-06], business_rules: [BR-03, BR-05, BR-09], architecture_rules: [ARCH-02, ARCH-07]}
    level: postgres + mvc
    actor: Member owner and Seller owner with distinct Account ID and SellerShop ID
    preconditions: [Two published Seller offers, owned address and cart, stock quantity 5 and version 0]
    input: POST /orders, PATCH /seller/stock/{variantId} with expectedVersion 0, POST /orders/{orderId}/cancellation, PATCH with expectedVersion 1, GET /seller/products/{productId}
    given: Disposable Testcontainers PostgreSQL fixture with generated order and actor IDs
    when: Checkout commits, Seller tries stale edit, Member cancels, Seller tries stale edit again
    then: {returned_result_or_error: 'checkout 201, stale edits 409 STALE_VERSION, cancel 200, Seller detail 200', persisted_state: 'stock returns to 5 at version 2; order CANCELLED; one placed and one cancellation audit', forbidden_effects: 'no stale overwrite, no extra restore'}
    fixtures: Existing CheckoutPostgresRedTest fixture
    concurrency: Sequential committed HTTP transactions, each response observed before the next command
    automation: {test_class: CheckoutPostgresRedTest, test_method: checkoutCancellationAndSellerEditShareStockVersion, command: './gradlew checkoutRed --tests com.phucle.ecommerce.ordering.CheckoutPostgresRedTest'}
    cleanup: Disposable database
    status: GREEN
  - scenario_id: AT-UC-04-LAST-UNIT
    automation: {test_class: CheckoutPostgresRedTest, test_method: twoMembersRacingForLastUnitCommitOnlyOneOrder}
    evidence_target: Two independent bounded HTTP requests; one 201 and one 409; fresh connection confirms one order, one stock decrement, no failed key or audit.
  - scenario_id: AT-UC-04-SAME-KEY
    automation: {test_class: CheckoutPostgresRedTest, test_method: concurrentIdenticalKeyReturnsOneOriginalOrderAndOneStockDecrement}
    evidence_target: Two independent bounded HTTP requests; both 201 with equal snapshots; fresh connection confirms one order/key/audit and one decrement.
  - scenario_id: AT-UC-04-LATE-AUDIT
    automation: {test_class: CheckoutPostgresRedTest, test_method: lateAuditFailureRollsBackStockOrderCartAndKey}
    evidence_target: Audit trigger fails after mutations; stock, cart, order and key roll back.
  - scenario_id: AT-UC-05-07-RACE
    automation: {test_class: SellerCodPostgresTest, test_methods: [cancelWinsRootLockBeforePayment, paymentWinsRootLockBeforeCancel]}
    evidence_target: Separate gate and HTTP transactions; PostgreSQL lock wait observed within 10 seconds; committed outcome checked through a fresh connection.
  - scenario_id: AT-UC-07-TWO-SELLERS
    automation: {test_class: SellerCodPostgresTest, test_method: twoSellersMarkConcurrentlyWithoutLostPayment}
    evidence_target: Two independent bounded HTTP commands with observed root lock wait; fresh connection confirms two PAID portions and two audits.
  - scenario_id: AT-UC-02-GUEST-MERGE
    automation: {test_class: CartHttpIntegrationTest, test_methods: [memberLoginConsumesGuestCartOnce, concurrentMergeConsumesOneGuestSourceOnlyOnce]}
    evidence_target: Login merges once and concurrent merge cannot consume source twice.
  - scenario_id: AT-UC-06-STALE-STOCK
    automation: {test_class: SellerStockPostgresTest, test_methods: [absoluteEditRequiresCurrentVersion, competingAbsoluteEditsCannotBothUseOneVersion]}
    evidence_target: Stale absolute edit is 409 and two same-version writes have one winner.
