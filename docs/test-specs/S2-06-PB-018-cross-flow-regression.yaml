    Ordering: Checkout, owned order reads, cancellation, Seller COD and audit orchestration through exported owner APIs.
    Inventory: Checkout stock decrease/restore and Seller expected-version replacement; owns stock table.
    Cart: Owned cart lock/consume and Guest merge; owns cart tables.
    Identity: Trusted actor, owned address and SellerShop resolution.
  commands: HTTP checkout, cancellation, mark-paid and stock edit each use their existing transactional input ports. Guest merge uses the login route.
