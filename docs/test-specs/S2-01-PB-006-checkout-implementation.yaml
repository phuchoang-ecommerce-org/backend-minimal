  decisions:
    - No schema migration; V1 already has the order, snapshot, stock version, audit and unique Member/key structures.
    - A PostgreSQL transaction advisory lock serializes each Member/key before cart and address reads.
    - One PlaceCodOrder handler coordinates the transaction through each owning module's exported API.
    - Ordering JDBC accesses only Ordering tables; an architecture source test guards this boundary.
    - CustomerOrder is the aggregate root; SellerOrder and OrderLine are separate entities, while OrderPlacementLine, snapshots and MoneyUsd are value objects. OrderFactory only assembles a placed root from validated facts.
    - OrderWritePort and CreationSnapshotReadPort separate writes from immutable creation replay.
    - No configured voucher is valid in this demo slice; unknown codes fail without retaining an intent.
  unresolved_decisions: []

