task_brief:
  title: Harden Cart actor boundary and checkout RED seams
  feedback: inkdrop://note/VFS1WsFD
  trace:
    use_cases: [UC-02, UC-03, UC-04]
    business_rules: [BR-03, BR-04, BR-06, BR-07]
    architecture_rules: [ARCH-01, ARCH-03, ARCH-05, ARCH-10]
  decisions:
    - Cart read and write use cases receive TrustedActor, with null only for Guest commands.
    - The Cart query handler implements an application projection interface used by the command handler.
    - Checkout RED seams stay in production source, while jar and bootJar are blocked until their placeholders are replaced.
    - Checkout application tests use constructor-injected fake ports; PostgreSQL tests own transaction proof.
  ports_and_boundaries: "CurrentActor resolves JWT identity at WebMVC; application handlers check role before repository access; Ordering application owns checkout collaboration ports."
  open_decisions: []
scenarios:
  - scenario_id: AT-UC-02-CART-DIRECT-ACTOR
    level: application
    actor: Seller with a Guest proof and arbitrary Account ID
    given: "Direct CartCommandService calls, without WebMVC authorization."
    when: setLine or removeLine
    then: "ROLE_DENIED before any repository read/create/write; Guest proof is not a fallback."
    persisted_state: unchanged
    forbidden_effects: [member cart access, Guest fallback]
    concurrency: not applicable
    test: CartActorBoundaryTest.directSellerSetCannotReadOrCreateMemberCart and directSellerRemoveCannotReadMemberCart
  - scenario_id: AT-UC-02-CART-DIRECT-QUERY
    level: application
    actor: Seller
    given: "Direct CartQueryService call."
    when: getMemberCart
    then: "ROLE_DENIED before CartReadPort access."
    persisted_state: unchanged
    forbidden_effects: [foreign cart disclosure]
    concurrency: not applicable
    test: CartActorBoundaryTest.directSellerQueryCannotReadMemberCart
